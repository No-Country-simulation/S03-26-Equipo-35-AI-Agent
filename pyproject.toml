[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["api*", "core*", "db*", "frontend*"]

[project]
name = "autostory-builder"
version = "0.1.0"
description = "Plataforma B2B SaaS que convierte materiales empresariales en contenido narrativo profesional usando IA con contexto de marca personalizado."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Diego Silvestre Borges Salces"},
]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "supabase>=2.13.0",
    "pgvector>=0.3.0",
    "cohere>=5.13.0",
    "groq>=0.15.0",
    "google-generativeai>=0.8.0",
    "openai>=1.60.0",
    "httpx>=0.28.0",
    "streamlit>=1.41.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-jose[cryptography]>=3.3.0",
    "python-dotenv>=1.0.0",
    "structlog>=24.4.0",
    "python-multipart>=0.0.18",
    "trafilatura>=2.0.0",
    "playwright>=1.48.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-groq>=0.2.0",
    "langsmith>=0.1.0",
    "youtube-transcript-api>=1.0.0",
    "python-docx>=1.0.0",
    "pypdf>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.9.0",
    "coverage>=7.6.0",
]

[tool.ruff]
target-version = "py311"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["api", "core", "db", "frontend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["core", "api", "db"]
omit = ["tests/*", "*/__init__.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
